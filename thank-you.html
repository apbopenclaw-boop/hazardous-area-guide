<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Thank You — Hazardous Area Guide</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="/css/style.css" />
<style>
  .thankyou-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 0 24px; }
  .thankyou-card { max-width: 480px; text-align: center; }
  .thankyou-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 64px; height: 64px; border-radius: 50%; margin-bottom: 24px;
    border: 1px solid rgba(0,112,243,0.3); background: rgba(0,112,243,0.08);
  }
  .thankyou-icon svg { width: 32px; height: 32px; color: var(--color-accent); }
  .thankyou-label { font-family: var(--font-mono); font-size: 12px; color: var(--gray-500); letter-spacing: 0.04em; margin-bottom: 16px; }
  .thankyou-title { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 12px; }
  .thankyou-text { font-size: 14px; color: var(--gray-400); line-height: 1.6; margin-bottom: 32px; }
</style>
</head>
<body>
  <div class="thankyou-page">
    <div class="thankyou-card">
      <div class="thankyou-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      </div>
      <p class="thankyou-label">§ Message sent</p>
      <h1 class="thankyou-title">Thank you</h1>
      <p class="thankyou-text">Your message has been received. We'll get back to you as soon as possible.</p>
      <a href="/" class="btn btn-primary">Back to home</a>
    </div>
  </div>
</body>
</html>
